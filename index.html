<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UD. BILAL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-3">

<div class="flex items-center gap-3 mb-4">
  <img src="logo.jpg" alt="UD. BILAL" class="w-14 h-14 md:w-16 md:h-16 object-cover">
  <div class="text-left">
    <h1 class="text-2xl md:text-3xl font-black text-green-800 leading-none">UD. BILAL</h1>
    <p class="text-sm text-yellow-600 font-semibold mt-1">Sembako Lengkap, Harga Bersahabat</p>
  </div>
</div>

<div class="bg-white p-3 rounded-xl shadow mb-3 flex justify-between items-center">
  <span id="statusLogin" class="text-sm font-bold text-red-500">🔒 Mode Lihat Saja</span>
  <button id="btnLogin" onclick="toggleLogin()" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm">LOGIN</button>
</div>

<div id="boxLogin" class="bg-yellow-50 border-2 border-yellow-300 p-4 rounded-xl shadow mb-3 space-y-3 hidden">
  <p class="font-bold text-center">Login Admin - Firebase Auth</p>
  <input id="inputEmail" type="email" placeholder="Email Admin" value="admin@bilal.com" class="w-full border p-3 rounded-lg">
  <input id="inputPass" type="password" placeholder="Password" class="w-full border p-3 rounded-lg">
  <button onclick="doLogin()" class="w-full bg-green-500 text-white p-3 rounded-lg font-bold">MASUK</button>
  <button onclick="toggleLogin()" class="w-full bg-gray-300 p-3 rounded-lg">Batal</button>
</div>

<div id="boxForm" class="bg-white p-4 rounded-xl shadow mb-3 space-y-3 opacity-40 pointer-events-none">
  <input id="nama" type="text" placeholder="Nama Barang" class="w-full border p-3 rounded-lg">
  <input id="modal" type="number" placeholder="Harga Modal - wajib angka" class="w-full border p-3 rounded-lg">
  <input id="harga" type="number" placeholder="Harga Jual - wajib angka" class="w-full border p-3 rounded-lg">
  <input id="keterangan" type="text" placeholder="Keterangan - boleh kosong (misal: Habis, Gudang)" class="w-full border p-3 rounded-lg">
  <input id="stok" type="text" placeholder="Stok - bebas (12, 12 Botol, 1 Dus)" class="w-full border p-3 rounded-lg">
  <button id="btnSimpan" onclick="simpan()" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold">SIMPAN</button>
  <button onclick="batalEdit()" class="w-full bg-gray-300 p-3 rounded-lg">Batal Edit</button>
</div>

<div class="bg-white p-3 rounded-xl shadow">
  <div id="tabel" class="space-y-3"></div>
  <div class="flex justify-between items-center mt-4">
    <button onclick="gantiPage(-1)" class="bg-gray-200 px-4 py-2 rounded-lg font-bold text-sm">⬅ Prev</button>
    <span id="infoPage" class="font-bold text-sm">Page 1 / 1</span>
    <button onclick="gantiPage(1)" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Next ➡</button>
  </div>
  <div class="footer text-center font-bold mt-3 text-sm border-t pt-3">Total Jenis Produk: 0 | Total Untung: Rp 0</div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>

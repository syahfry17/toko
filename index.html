<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UD. BILAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .last-update { font-size: 12px; color: #888; }
    .badge-baru { font-size: 11px; background: #ff3b30; color: #fff; padding: 3px 7px; border-radius: 20px; font-weight: 700; }
    #cropBox { width: 100%; height: 280px; overflow: hidden; position: relative; background: #000; touch-action: none; border-radius: 12px; }
    #cropImg { position: absolute; left: 50%; top: 50%; max-width: none; will-change: transform; touch-action: none; }
    #cropFrame { position: absolute; left: 50%; top: 50%; width: 92%; height: 82%; transform: translate(-50%,-50%); border: 2px dashed #fff; border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,0.5); pointer-events: none; }
  </style>
</head>
<body class="bg-gray-100 p-3">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;background:linear-gradient(135deg,#ffffff 0%,#f0fdf4 100%);padding:12px 14px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border-bottom:2px solid #fbbf24;">
    <a href="/toko/" style="display:flex;flex-shrink:0;">
      <img src="logov2.png" alt="UD. BILAL" class="w-14 h-14 md:w-16 md:h-16 object-cover" style="border-radius:50%;border:2px solid #fbbf24;box-shadow:0 3px 10px rgba(21,101,52,0.25);background:#fff;">
    </a>
    <div class="text-left" style="line-height:1.1;">
      <h1 class="text-2xl md:text-3xl font-black leading-none" style="color:#166534;letter-spacing:0.5px;">UD. <span style="color:#15803d;">BILAL</span></h1>
      <p class="text-sm font-semibold mt-1" style="color:#b45309;">Sembako Lengkap, Harga Bersahabat</p>
      <div style="width:118px;height:3px;background:linear-gradient(90deg,#16a34a,#fbbf24);border-radius:99px;margin-top:5px;"></div>
    </div>
  </div>

  <div class="bg-white p-3 rounded-xl shadow mb-3 flex justify-between items-center">
    <span id="statusLogin" class="text-sm font-bold text-red-500">🔒 Mode Lihat Saja</span>
    <button id="btnLogin" onclick="toggleLogin()" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm">LOGIN</button>
  </div>

  <div id="boxLogin" class="bg-yellow-50 border-2 border-yellow-300 p-4 rounded-xl shadow mb-3 space-y-3 hidden">
    <p class="font-bold text-center">Login Admin - Firebase Auth</p>
    <input id="inputEmail" type="email" placeholder="Email Admin" value="admin@bilal.com" class="w-full border p-3 rounded-lg">
    <input id="inputPass" type="password" placeholder="Password" class="w-full border p-3 rounded-lg">
    <button onclick="doLogin()" class="w-full bg-green-500 text-white p-3 rounded-lg font-bold">MASUK</button>
    <button onclick="toggleLogin()" class="w-full bg-gray-300 p-3 rounded-lg">Batal</button>
  </div>

  <button id="btnTambah" onclick="bukaForm()" class="w-full bg-blue-500 text-white p-3 rounded-xl font-bold mb-3 hidden">+ Tambah Barang</button>
  <input id="inputCari" oninput="cariBarang(this.value)" type="text" placeholder="🔍 Cari barang... misal: Beras, Minyak, Gula" class="w-full border-2 border-gray-300 p-3 rounded-xl mb-3 bg-white font-bold">

  <div class="bg-white p-3 rounded-xl shadow">
    <div id="tabel" class="space-y-3"></div>
    <div class="flex justify-between items-center mt-4">
      <button onclick="gantiPage(-1)" class="bg-gray-200 px-4 py-2 rounded-lg font-bold text-sm">⬅ Prev</button>
      <span id="infoPage" class="font-bold text-sm">Page 1 / 1</span>
      <button onclick="gantiPage(1)" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Next ➡</button>
    </div>
    <div class="footer text-center font-bold mt-3 text-sm border-t pt-3">Total Jenis Produk: 0 | Total Untung: Rp 0</div>
  </div>

  <div id="popupForm" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-start justify-center p-3 pt-10" onclick="tutupForm()">
    <div class="bg-white p-4 rounded-xl shadow w-full max-w-md space-y-3" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center">
        <h2 id="judulForm" class="font-bold text-lg">Tambah Barang</h2>
        <button onclick="tutupForm()" class="bg-gray-200 w-8 h-8 rounded-full font-bold">✕</button>
      </div>
      <div id="boxForm" class="space-y-3">
        <input id="nama" type="text" placeholder="Nama Barang" class="w-full border p-3 rounded-lg">
        <input id="modal" type="number" placeholder="Harga Modal - wajib angka" class="w-full border p-3 rounded-lg">
        <input id="harga" type="number" placeholder="Harga Jual - wajib angka" class="w-full border p-3 rounded-lg">
        <input id="keterangan" type="text" placeholder="Keterangan - boleh kosong (misal: Habis, Gudang)" class="w-full border p-3 rounded-lg">
        <input id="stok" type="text" placeholder="Stok - bebas (12, 12 Botol, 1 Dus)" class="w-full border p-3 rounded-lg">
        <label class="block text-sm font-bold">Foto Barang:</label>
        <input id="fotoInput" type="file" accept="image/*" class="w-full border p-3 rounded-lg bg-white">
        <img id="fotoPreview" class="w-full h-40 object-cover rounded-lg hidden bg-gray-100">
        <p id="fotoStatus" class="text-xs text-gray-500 text-center"></p>
        <button id="btnSimpan" onclick="simpan()" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold">SIMPAN</button>
        <button onclick="batalEdit()" class="w-full bg-gray-300 p-3 rounded-lg">Batal Edit</button>
      </div>
    </div>
  </div>

  <!-- POPUP CROP -->
  <div id="cropModal" class="fixed inset-0 bg-black bg-opacity-90 z-[100] hidden flex items-center justify-center p-3">
    <div class="bg-white p-4 rounded-xl w-full max-w-md space-y-3">
      <h2 class="font-bold text-center">✂️ Crop Foto - Geser & Zoom</h2>
      <p class="text-xs text-center text-gray-500">Geser fotonya pakai jari, yang di dalam kotak putih yang bakal kepakai</p>
      <div id="cropBox">
        <img id="cropImg" src="">
        <div id="cropFrame"></div>
      </div>
      <label class="block text-sm font-bold">🔍 Zoom: <span id="zoomLabel">100%</span></label>
      <input id="zoomSlider" type="range" min="100" max="300" value="100" class="w-full" oninput="aturZoom(this.value)">
      <button onclick="potongFoto()" class="w-full bg-green-500 text-white p-3 rounded-lg font-bold">✂️ POTONG & PAKAI FOTO INI</button>
      <button onclick="batalCrop()" class="w-full bg-gray-300 p-3 rounded-lg">Batal Crop</button>
    </div>
  </div>

  <script type="module" src="script.js?v=100"></script>
</body>
</html>

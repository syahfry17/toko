<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UD. BILAL - Toko Kelontong</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body class="bg-gray-100">

  <!-- ================= HEADER UD. BILAL ================= -->
  <header class="bg-green-500 text-white p-4 text-center sticky top-1 z-50 shadow">
    <h1 class="text-2xl font-black">UD. BILAL</h1>
    <p class="text-sm">Toko Kelontong & Sembako • Pangkatan</p>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- ================= PENCARIAN ALA MACAU ================= -->
    <!-- Ini yang kita rapikan tadi, udah nyambung ke style.css -->
    <div class="pencarian-wrap">
      <div class="pencarian-box">
        <input
          id="cariBarang"
          type="text"
          inputmode="search"
          autocomplete="off"
          placeholder="🔍 Cari barang..."
          oninput="cariBarang()"
          aria-label="Cari barang"
        >
        <button
          id="btnClearSearch"
          type="button"
          aria-label="Hapus pencarian"
          hidden
        >×</button>
      </div>
      <div
        id="infoHasilCari"
        class="hasil-cari"
        role="status"
        aria-live="polite"
        hidden
      ></div>
    </div>

    <!-- ================= KATEGORI ================= -->
    <div id="kategoriWrap" class="flex gap-2 overflow-hidden">
      <button onclick="filterKategori('semua')" class="bg-white border border-gray-300 rounded-full px-4 py-2 text-sm font-bold">Semua</button>
      <button onclick="filterKategori('sembako')" class="bg-white border border-gray-300 rounded-full px-4 py-2 text-sm font-bold">Sembako</button>
      <button onclick="filterKategori('rokok')" class="bg-white border border-gray-300 rounded-full px-4 py-2 text-sm font-bold">Rokok</button>
      <button onclick="filterKategori('minuman')" class="bg-white border border-gray-300 rounded-full px-4 py-2 text-sm font-bold">Minuman</button>
      <button onclick="filterKategori('snack')" class="bg-white border border-gray-300 rounded-full px-4 py-2 text-sm font-bold">Snack</button>
    </div>

    <!-- ================= STATUS / INFO ================= -->
    <div
      id="statusData"
      role="status"
      style="text-align:center;font-size:13px;color:#555;padding:6px 4px"
    ></div>

    <!-- ================= DAFTAR BARANG ================= -->
    <!-- Barang diisi otomatis dari script.js -->
    <div id="daftarBarang" class="grid gap-2">
      <p class="text-center text-gray-500 text-sm p-4">Memuat barang...</p>
    </div>

    <!-- Kalau barang tidak ketemu -->
    <div id="barangKosong" class="hidden text-center p-5 bg-white rounded-xl">
      <p class="text-gray-500 text-sm">Barang tidak ditemukan</p>
      <button onclick="hapusCari()" class="mt-2 bg-green-500 text-white px-4 py-2 rounded-full text-sm font-bold">Tampilkan Semua</button>
    </div>

  </main>

  <!-- ================= KERANJANG / BAWAH ================= -->
  <div class="max-w-md mx-auto p-3 pb-10">
    <button id="btnKeranjang" onclick="bukaKeranjang()" class="w-full bg-green-500 text-white p-4 rounded-2xl font-black shadow flex justify-between items-center">
      <span>🛒 Keranjang</span>
      <span id="totalKeranjang">Rp 0</span>
    </button>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="text-center pb-10">
    <div class="garis"></div>
    <div class="brand font-black">UD. BILAL</div>
    <div class="copy text-xs text-gray-500">© 2025 - 2026 • All Rights Reserved</div>
  </footer>

  <!-- ================= TOMBOL KE ATAS ================= -->
  <button id="btnTop" onclick="keAtas()">
    <span class="panah">^</span>
    <span class="teks">TOP</span>
  </button>

  <script>
    function keAtas() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>

  <!-- JS TOKO -->
  <script src="script.js?v=2" defer></script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UD. BILAL - Toko Sembako</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #tabel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kartu { background: #fff; border: 1px solid #eee; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
    .kartu img.foto-produk { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #f8f8f8; }
    .qty-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; background: #f3f4f6; }
    .badge-baru { font-size: 10px; background: #ff3b30; color: #fff; padding: 2px 6px; border-radius: 20px; font-weight: 700; }
    .last-update { font-size: 10px; color: #999; }
  </style>
</head>
<body class="bg-gray-100 p-3">
  <!-- HEADER + TOMBOL LOGIN DI POJOK KANAN -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;background:linear-gradient(135deg,#ffffff 0%,#f0fdf4 100%);padding:12px 14px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border-bottom:2px solid #fbbf24;position:relative;">
    <img src="logov2.png" class="w-14 h-14 object-cover" style="border-radius:50%;border:2px solid #fbbf24;background:#fff;">
    <div style="line-height:1.1;flex:1;">
      <h1 class="text-2xl font-black" style="color:#166534;">UD. <span style="color:#15803d;">BILAL</span></h1>
      <p class="text-sm font-semibold mt-1" style="color:#b45309;">Sembako Lengkap, Harga Bersahabat</p>
      <div style="width:118px;height:3px;background:linear-gradient(90deg,#16a34a,#fbbf24);border-radius:99px;margin-top:5px;"></div>
    </div>
    <!-- TOMBOL LOGIN POJOK KANAN ATAS -->
    <button onclick="bukaPopupLogin()" style="position:absolute;top:8px;right:8px;background:#f3f4f6;border:1px solid #e5e7eb;width:36px;height:36px;border-radius:50%;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,0.1);" title="Login Admin">🔐</button>
  </div>

  <input id="inputCari" oninput="cariBarang(this.value)" type="text" placeholder="🔍 Cari barang... misal: Beras, Minyak, Gula" class="w-full border-2 border-gray-300 p-3 rounded-xl mb-3 bg-white font-bold">

  <div class="bg-white p-3 rounded-xl shadow">
    <div id="tabel"></div>
    <div class="flex justify-between items-center mt-4">
      <button onclick="gantiPage(-1)" class="bg-gray-200 px-4 py-2 rounded-lg font-bold text-sm">⬅ Prev</button>
      <span id="infoPage" class="font-bold text-sm">Page 1 / 1</span>
      <button onclick="gantiPage(1)" class="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Next ➡</button>
    </div>
    <div class="footer text-center font-bold mt-3 text-sm border-t pt-3">Total Jenis Produk: 0</div>
  </div>

  <p class="text-center text-xs text-gray-400 mt-4">© UD. BILAL - Pesan via WhatsApp, Bayar di Tempat / Transfer</p>

  <!-- POPUP LOGIN ADMIN -->
  <div id="popupLoginPengunjung" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4" onclick="tutupPopupLogin()">
    <div class="bg-white p-5 rounded-2xl shadow w-full max-w-sm space-y-3" onclick="event.stopPropagation()">
      <div class="text-center">
        <div class="text-4xl">🔐</div>
        <h2 class="font-black text-lg mt-1">Login Admin</h2>
        <p class="text-xs text-gray-500">Hanya untuk pemilik toko UD. BILAL</p>
      </div>
      <input id="loginEmailPengunjung" type="email" placeholder="Email Admin" value="admin@bilal.com" class="w-full border p-3 rounded-lg">
      <input id="loginPassPengunjung" type="password" placeholder="Password" class="w-full border p-3 rounded-lg">
      <button onclick="masukKeAdmin()" class="w-full bg-green-500 text-white p-3 rounded-lg font-bold">MASUK KE ADMIN ➡</button>
      <button onclick="tutupPopupLogin()" class="w-full bg-gray-200 p-3 rounded-lg font-bold">Batal</button>
      <p class="text-[11px] text-center text-gray-400">Pembeli tidak perlu login, langsung pesan via WA aja ya 🙏</p>
    </div>
  </div>

  <script>
    function bukaPopupLogin(){ document.getElementById('popupLoginPengunjung').classList.remove('hidden'); }
    function tutupPopupLogin(){ document.getElementById('popupLoginPengunjung').classList.add('hidden'); }
    function masukKeAdmin(){
      // Simpan email-nya biar di halaman admin udah keisi, terus loncat ke admin.html
      var email = document.getElementById('loginEmailPengunjung').value;
      if(email) localStorage.setItem('emailAdminBilal', email);
      window.location.href = 'admin.html';
    }
  </script>

  <script type="module" src="script.js?v=109"></script>
</body>
</html>

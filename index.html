<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UD. BILAL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-3">
<h1 class="text-3xl text-center text-blue-500">UD. BILAL</h1>
<p class="text-center text-gray-600 mb-3">Data Barang Sembako</p>

<div class="bg-white p-4 rounded-xl shadow mb-3 space-y-3">
<input id="nama" placeholder="Nama Barang" class="w-full border p-3 rounded-lg">
<input id="modal" type="number" placeholder="Harga Modal" class="w-full border p-3 rounded-lg">
<input id="harga" type="number" placeholder="Harga Jual" class="w-full border p-3 rounded-lg">
<input id="stok" type="number" placeholder="Stok" class="w-full border p-3 rounded-lg">
<button id="btnSimpan" onclick="simpan()" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold">SIMPAN</button>
<button onclick="batalEdit()" class="w-full bg-gray-300 p-3 rounded-lg">Batal Edit</button>
</div>

<div class="bg-white p-3 rounded-xl shadow">
<div id="tabel" class="space-y-3"></div>
<div class="footer text-center font-bold mt-3 text-sm border-t pt-3">Total Barang: 0 | Total Untung Stok: Rp 0</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyAhce1AyhPGe1cDkIzcBcgAFFOXC2Isxx0", authDomain: "toko-bilal.firebaseapp.com", projectId: "toko-bilal", storageBucket: "toko-bilal.firebasestorage.app", messagingSenderId: "507155195256", appId: "1:507155195256:web:39185c267b272b5672948d" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let barang = [], editId = null;
onSnapshot(query(collection(db, "barang"), orderBy("nama")), (snap) => { barang = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
function render() {
  let totalUntung = 0; let html = '';
  barang.forEach(b => {
    let j = b.jual || b.harga || 0; let u = j - b.modal; totalUntung += u * b.stok;
    html += `<div class="border-2 border-gray-300 rounded-xl overflow-hidden">
      <div class="flex justify-between items-center bg-blue-50 px-3 py-2 border-b-2 border-gray-300"><span class="font-bold text-lg">${b.nama}</span><span class="bg-blue-500 text-white text-xs font-bold px-3 py-1 rounded-full">STOK: ${b.stok}</span></div>
      <div class="px-3 py-2 flex justify-between border-b border-gray-200"><span class="text-gray-500">Harga Modal</span><span class="font-bold">Rp ${Number(b.modal).toLocaleString('id-ID')}</span></div>
      <div class="px-3 py-2 flex justify-between border-b border-gray-200"><span class="text-gray-500">Harga Jual</span><span class="font-bold">Rp ${Number(j).toLocaleString('id-ID')}</span></div>
      <div class="px-3 py-2 flex justify-between"><span class="text-gray-500">Untung / pcs</span><span class="font-bold text-green-600">Rp ${u.toLocaleString('id-ID')}</span></div>
      <div class="flex"><button onclick="editBarang('${b.id}')" class="flex-1 bg-green-500 text-white py-2 font-bold text-sm">EDIT</button><button onclick="hapus('${b.id}')" class="flex-1 bg-red-500 text-white py-2 font-bold text-sm">HAPUS</button></div>
    </div>`;
  });
  if(barang.length===0) html = `<p class="text-center text-gray-400 py-4">Belum ada barang</p>`;
  document.getElementById('tabel').innerHTML = html;
  document.querySelector('.footer').innerHTML = `Total Barang: ${barang.length} | Total Untung Stok: Rp ${totalUntung.toLocaleString('id-ID')}`;
}
window.simpan = async () => {
  let nama = document.getElementById('nama').value; let modal = Number(document.getElementById('modal').value); let jual = Number(document.getElementById('harga').value); let stok = Number(document.getElementById('stok').value);
  if (!nama || !modal || !jual) return alert("Isi dulu!");
  if (editId) { await updateDoc(doc(db, "barang", editId), { nama, modal, jual, harga: jual, stok }); editId = null; document.getElementById('btnSimpan').innerText = "SIMPAN"; }
  else { await addDoc(collection(db, "barang"), { nama, modal, jual, harga: jual, stok }); }
  document.getElementById('nama').value=''; document.getElementById('modal').value=''; document.getElementById('harga').value=''; document.getElementById('stok').value='';
};
window.editBarang = (id) => { let b = barang.find(x => x.id === id); document.getElementById('nama').value = b.nama; document.getElementById('modal').value = b.modal; document.getElementById('harga').value = b.jual || b.harga; document.getElementById('stok').value = b.stok; editId = id; document.getElementById('btnSimpan').innerText = "UPDATE"; window.scrollTo(0,0); };
window.hapus = async (id) => { if (confirm("Hapus?")) await deleteDoc(doc(db, "barang", id)); };
window.batalEdit = () => { editId = null; document.getElementById('nama').value=''; document.getElementById('modal').value=''; document.getElementById('harga').value=''; document.getElementById('stok').value=''; document.getElementById('btnSimpan').innerText="SIMPAN"; };
</script>
</body>
</html>

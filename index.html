<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko UD. BILAL</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f8fafc; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .header-toko { background: linear-gradient(135deg, #166534 0%, #16a34a 100%); color: white; padding: 20px; text-align: center; }
    .header-toko h1 { margin: 0; font-size: 22px; }
    .header-toko p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
    .container { padding: 15px; max-width: 1200px; margin: 0 auto; }
    .cari-barang { width: 100%; padding: 12px 15px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 15px; margin-bottom: 20px; box-sizing: border-box; }
    .grid-produk { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .kartu-produk { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .kartu-produk img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #f1f5f9; }
    .info-produk { padding: 12px; }
    .nama-produk { font-weight: 600; font-size: 14px; margin-bottom: 5px; }
    .harga-produk { color: #16a34a; font-weight: 700; font-size: 15px; }
    .stok-produk { font-size: 12px; color: #888; margin-top: 5px; }
    .btn-pesan { width: 100%; background: #2563eb; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 600; margin-top: 10px; cursor: pointer; }
    .footer-info { text-align: center; margin-top: 30px; padding: 20px; font-size: 13px; color: #777; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .tidak-ada { text-align: center; padding: 40px; color: #888; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="header-toko">
    <h1>🏪 UD. BILAL</h1>
    <p>Belanja Mudah & Terpercaya — Medan</p>
  </div>

  <div class="container">
    <input type="text" id="cariToko" class="cari-barang" placeholder="🔍 Cari barang..." autocomplete="off">
    
    <div id="daftarProduk" class="grid-produk">
      <div class="loading">⏳ Sedang memuat barang...</div>
    </div>
  </div>

  <div class="footer-info">
    <p>📞 Hubungi: <a href="https://wa.me/6281919194295" target="_blank" style="color:#2563eb;text-decoration:none;">WhatsApp</a></p>
    <p>📍 Lokasi: Medan, Indonesia</p>
    <p style="margin-top:10px;font-size:11px;color:#aaa;">© 2026 UD. BILAL — Semua Hak Dilindungi</p>
  </div>

  <script type="module">
    // Koneksi Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhce1AyhPGe1cDkIzcBcgAFFOXC2Isxx0",
      authDomain: "toko-bilal.firebaseapp.com",
      projectId: "toko-bilal",
      storageBucket: "toko-bilal.firebasestorage.app",
      messagingSenderId: "507155195256",
      appId: "1:507155195256:web:39185c267b272b5672948d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let barang = [];
    let kataCari = '';

    // Fungsi format harga
    function formatHarga(angka) {
      return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    // Fungsi tampilkan barang
    function tampilkanBarang() {
      const wadah = document.getElementById('daftarProduk');
      
      // Filter pencarian
      const hasil = barang.filter(b => {
        if (!kataCari) return true;
        return b.nama?.toLowerCase().includes(kataCari) || 
               b.keterangan?.toLowerCase().includes(kataCari);
      });

      if (hasil.length === 0) {
        wadah.innerHTML = '<div class="tidak-ada">Barang tidak ditemukan</div>';
        return;
      }

      wadah.innerHTML = hasil.map(b => `
        <div class="kartu-produk">
          <img src="${b.foto || 'logov2.png'}" alt="${b.nama}" loading="lazy">
          <div class="info-produk">
            <div class="nama-produk">${b.nama || 'Tanpa Nama'}</div>
            <div class="harga-produk">${formatHarga(b.harga_jual || 0)}</div>
            <div class="stok-produk">Stok: ${b.stok || 0}</div>
            <button class="btn-pesan" onclick="window.open('https://wa.me/6281919194295?text=Halo%2C%20saya%20ingin%20pesan%20${encodeURIComponent(b.nama || 'barang')}', '_blank')">Pesan via WhatsApp</button>
          </div>
        </div>
      `).join('');
    }

    // Dengarkan perubahan data dari Firebase
    const q = query(collection(db, "barang_public"), orderBy("nama"));
    onSnapshot(q, (snapshot) => {
      barang = [];
      snapshot.docs.forEach(doc => {
        barang.push({ id: doc.id, ...doc.data() });
      });
      tampilkanBarang();
    }, (error) => {
      console.error('Error memuat data:', error);
      document.getElementById('daftarProduk').innerHTML = '<div class="tidak-ada">❌ Gagal memuat data. Coba muat ulang.</div>';
    });

    // Pencarian
    let timerCari;
    document.getElementById('cariToko').addEventListener('input', function() {
      clearTimeout(timerCari);
      timerCari = setTimeout(() => {
        kataCari = this.value.toLowerCase().trim();
        tampilkanBarang();
      }, 250);
    });

  </script>

</body>
</html>

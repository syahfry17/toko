<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UD. BILAL - Data Barang Sembako</title><script src="https://cdn.tailwindcss.com"></script><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import {getFirestore,collection,addDoc,deleteDoc,doc,updateDoc,onSnapshot,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyAhce1AyhPGe1cDkIzcBcgAFFOXC2Isxx0",authDomain:"toko-bilal.firebaseapp.com",projectId:"toko-bilal",storageBucket:"toko-bilal.firebasestorage.app",messagingSenderId:"507155195256",appId:"1:507155195256:web:39185c267b272b5672948d"};const app=initializeApp(firebaseConfig);const db=getFirestore(app);let barang=[],editId=null;onSnapshot(query(collection(db,"barang"),orderBy("nama")),(s)=>{barang=s.docs.map(d=>({id:d.id,...d.data()}));render();});function render(){let q=document.getElementById('cari').value.toLowerCase();let list=barang.filter(b=>b.nama.toLowerCase().includes(q));let totalUntung=0;document.getElementById('list').innerHTML=list.map(b=>{let untung=b.jual-b.modal;totalUntung+=untung*b.stok;return `<tr class="border-b"><td class="p-2">${b.nama}</td><td class="p-2">Rp ${Number(b.modal).toLocaleString('id-ID')}</td><td class="p-2">Rp ${Number(b.jual).toLocaleString('id-ID')}</td><td class="p-2">Rp ${untung.toLocaleString('id-ID')}</td><td class="p-2 text-center">${b.stok}</td><td class="p-2"><button onclick="window.editBarang('${b.id}')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Edit</button> <button onclick="window.hapus('${b.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Hapus</button></td></tr>`}).join('');document.getElementById('total').innerText=`Total Barang: ${list.length} | Total Untung Stok: Rp ${totalUntung.toLocaleString('id-ID')}`;document.getElementById('status').innerText="● Database Firebase TERHUBUNG - Bisa dilihat di HP lain";}window.cariRender=render;window.simpan=async()=>{let nama=document.getElementById('nama').value,modal=Number(document.getElementById('modal').value),jual=Number(document.getElementById('jual').value),stok=Number(document.getElementById('stok').value);if(!nama||!modal||!jual)return alert("Isi Nama, Modal, Jual dulu!");try{if(editId){await updateDoc(doc(db,"barang",editId),{nama,modal,jual,stok});editId=null;document.getElementById('btnSimpan').innerText="SIMPAN";}else{await addDoc(collection(db,"barang"),{nama,modal,jual,stok});}document.getElementById('nama').value='';document.getElementById('modal').value='';document.getElementById('jual').value='';document.getElementById('stok').value='';}catch(e){alert("Gagal simpan: "+e.message);}};window.editBarang=(id)=>{let b=barang.find(x=>x.id===id);document.getElementById('nama').value=b.nama;document.getElementById('modal').value=b.modal;document.getElementById('jual').value=b.jual;document.getElementById('stok').value=b.stok;editId=id;document.getElementById('btnSimpan').innerText="UPDATE";window.scrollTo(0,0);};window.hapus=async(id)=>{if(confirm("Hapus?"))await deleteDoc(doc(db,"barang",id));};</script></head><body class="bg-gray-100 min-h-screen p-3"><div class="max-w-2xl mx-auto"><h1 class="text-3xl font-bold text-center text-blue-600">UD. BILAL</h1><p class="text-center text-gray-600 mb-3">Data Barang Sembako</p><p id="status" class="text-center text-xs text-green-600 font-bold mb-2">● Menghubungkan...</p><div class="bg-white p-4 rounded-xl shadow mb-3"><input id="nama" class="w-full border p-3 rounded-lg mb-2" placeholder="Nama Barang - cth: Beras"><input id="modal" type="number" class="w-full border p-3 rounded-lg mb-2" placeholder="Harga Modal - cth: 160000"><input id="jual" type="number" class="w-full border p-3 rounded-lg mb-2" placeholder="Harga Jual - cth: 177000"><input id="stok" type="number" class="w-full border p-3 rounded-lg mb-2" placeholder="Stok - cth: 5"><button id="btnSimpan" onclick="window.simpan()" class="w-full bg-blue-500 text-white p-3 rounded-lg font-bold">SIMPAN</button></div><input id="cari" oninput="window.cariRender()" class="w-full border p-3 rounded-lg mb-3 bg-white" placeholder="Cari barang..."><div class="bg-white rounded-xl overflow-hidden shadow"><table class="w-full text-sm"><tr class="bg-blue-500 text-white"><th class="p-2 text-left">Nama</th><th class="p-2">Modal</th><th class="p-2">Jual</th><th class="p-2">Untung</th><th class="p-2">Stok</th><th class="p-2">Aksi</th></tr><tbody id="list"></tbody></table></div><p id="total" class="text-center font-bold mt-3"></p><p class="text-center text-xs text-gray-400 mt-1">Data tersimpan di Firebase toko-bilal • Buka di HP mana aja tetap sama</p></div></body></html>

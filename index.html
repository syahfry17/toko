<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UD. Bilal - Data Toko</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>UD. BILAL</h2>
<p class="sub">Data Barang Sembako</p>

<div class="kotak">
  <input type="text" id="nama" placeholder="Nama Barang - cth: Beras">
  <input type="number" id="harga" placeholder="Harga Jual - cth: 65000">
  <input type="number" id="stok" placeholder="Stok - cth: 20">
  <button onclick="simpan()">SIMPAN</button>
</div>

<input type="text" id="cari" placeholder="Cari barang..." onkeyup="tampil()">

<table>
  <thead>
    <tr><th>Nama</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>
  </thead>
  <tbody id="tabel"></tbody>
</table>

<p class="footer">Total Barang: <span id="total">0</span></p>

<script src="script.js"></script>
</body>
</html>

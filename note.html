<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salin catatan hutang · UD BILAL</title>
<style>*{box-sizing:border-box}body{max-width:36rem;margin:auto;padding:1rem;color:#173923;font:16px/1.5 system-ui}input,button,textarea{width:100%;padding:.8rem;margin:.4rem 0;border:1px solid #9cad9d;border-radius:.6rem;font:inherit}button{background:#166534;color:white;font-weight:650}textarea{height:8rem}output{display:block;margin:1rem 0;white-space:pre-line}button:disabled{opacity:.55}</style>
<h1>Salin catatan hutang</h1><p>Buka dari browser yang biasa dipakai untuk mencatat hutang. Cocokkan ringkasan dengan halaman Catatan Hutang sebelum menyalin SQL.</p>
<form hidden id="login"><label>Email admin Firebase<input id="email" type="email" autocomplete="username" required></label><label>Sandi admin Firebase<input id="pass" type="password" autocomplete="current-password" required></label><button id="enter">Masuk</button></form>
<output id="message">Memeriksa sesi admin…</output><section id="box" hidden><button id="copy">Salin SQL hutang</button><textarea readonly hidden id="manual" aria-label="SQL pribadi"></textarea><output id="notice"></output></section>
<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAhce1AyhPGe1cDkIzcBcgAFFOXC2Isxx0",
  authDomain: "toko-bilal.firebaseapp.com",
  projectId: "toko-bilal",
  storageBucket: "toko-bilal.firebasestorage.app",
  messagingSenderId: "507155195256",
  appId: "1:507155195256:web:39185c267b272b5672948d"
};
const ADMIN_UID = "spaWNW7l2YSqBvhC7hkK6Sd3d7A3";


const el=id=>document.getElementById(id);
let sql='';
function makeExport(rows) {
  if(!Array.isArray(rows)||!rows.length) throw new Error('Belum ada catatan tersimpan di browser ini. Buka halaman hutang lama di browser dan alamat situs yang sama.');
  const ids=new Set();
  const catatan=rows.map((r,index)=>{
    const fail=()=>{throw new Error('Periksa ID, nama, tanggal, nominal atau status pada catatan ke-'+(index+1)+'.');};
    if(!r||!/^\d+$/.test(String(r.id))||!Number.isSafeInteger(Number(r.id))||ids.has(Number(r.id))) fail();
    ids.add(Number(r.id));
    const tanggal=String(r.tanggal??'').split('T')[0];
    const nominal=String(r.jumlah??'').trim();
    if(typeof r.nama!=='string'||!r.nama.trim()||typeof r.ket!=='string'||!/^\d{4}-\d\d-\d\d$/.test(tanggal)||!Number.isFinite(Date.parse(tanggal))||new Date(tanggal).toISOString().slice(0,10)!==tanggal||!/^[-+]?\d+(\.\d+)?$/.test(nominal)||!Number.isFinite(Number(nominal))||!['Lunas','Belum Lunas'].includes(r.status)) fail();
    return {id:Number(r.id),nama:r.nama,tanggal,ket:r.ket,jumlah:nominal,status:r.status};
  });
  const json=JSON.stringify(catatan);
  let tag='$data$';while(json.includes(tag))tag=tag.slice(0,-1)+'x$';
  const query=`begin;
create temporary table sumber_hutang on commit drop as
select * from jsonb_to_recordset(${tag}${json}${tag}::jsonb) as r
(id bigint,nama text,tanggal date,ket text,jumlah numeric,status text);
insert into public.catatan_hutang (id,nama,tanggal,ket,jumlah,status)
select id,nama,tanggal,ket,jumlah,status from sumber_hutang
on conflict (id) do nothing;
do $cek$
begin
  if exists (
    select id,nama,tanggal,ket,jumlah,status from sumber_hutang
    except
    select id,nama,tanggal,ket,jumlah,status from public.catatan_hutang
  ) then raise exception 'Ada ID dengan isi berbeda. Impor dibatalkan.';
  end if;
end $cek$;
commit;
select count(*) as total_catatan, count(*) filter(where jumlah<0) as cicilan,
coalesce(sum(jumlah) filter(where status='Belum Lunas'),0) as sisa_hutang
from public.catatan_hutang;`;
  return {query,total:catatan.length,cicilan:catatan.filter(r=>Number(r.jumlah)<0).length,sisa:catatan.reduce((sum,r)=>sum+(r.status==='Belum Lunas'?Number(r.jumlah):0),0)};
}
function clearOutput(){sql='';el('box').hidden=true;el('manual').value='';el('manual').hidden=true;el('notice').textContent='';}
async function start(){
 const base='https://www.gstatic.com/firebasejs/10.12.2/firebase-';
 const [app,fa]=await Promise.all([import(base+'app.js'),import(base+'auth.js')]);
 const auth=fa.getAuth(app.initializeApp(firebaseConfig));
 fa.onAuthStateChanged(auth,user=>{
   clearOutput();const admin=user?.uid===ADMIN_UID;el('login').hidden=admin;
   if(!admin){el('message').textContent=user?'Gunakan akun admin Firebase toko.':'Masuk dengan akun admin Firebase lama.';return;}
   try {
     const out=makeExport(JSON.parse(localStorage.getItem('hutang')||'[]'));
     sql=out.query;el('box').hidden=false;
     el('message').textContent='Terbaca: '+out.total+' catatan, termasuk '+out.cicilan+' cicilan.\nSisa hutang: Rp '+out.sisa.toLocaleString('id-ID');
   } catch(e){el('message').textContent=e.message;}
 });
 el('login').onsubmit=async e=>{e.preventDefault();el('enter').disabled=true;
 try{await fa.signInWithEmailAndPassword(auth,el('email').value.trim(),el('pass').value);}
 catch{el('message').textContent='Gagal masuk. Periksa akun Firebase dan koneksi.';}
 finally{el('enter').disabled=false;el('pass').value='';}};
}
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(sql);el('notice').textContent='SQL sudah disalin. Tempel di SQL Editor pribadi proyek data-sembako.';}
catch{el('manual').hidden=false;el('manual').value=sql;el('manual').select();el('notice').textContent='Tekan lama lalu pilih Salin.';}};
start().catch(()=>{el('message').textContent='Gagal memuat login Firebase. Periksa koneksi lalu muat ulang.';});
</script></html>

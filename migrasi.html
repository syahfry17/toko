<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Migrasi Foto - UD. BILAL</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="supabase.min.js"></script>
<script src="toko-db.js"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto bg-white rounded-2xl shadow p-5">
  <h1 class="text-xl font-bold text-center">Migrasi Foto Lama</h1>
  <p class="text-sm text-gray-500 text-center mt-1">Ubah foto Base64 jadi Link Storage.<br>Jalanin 1x aja, jangan tutup HP selama jalan.</p>

  <div class="mt-4 space-y-2">
    <input id="email" type="email" placeholder="Email admin" class="w-full border rounded-lg px-3 py-2">
    <input id="password" type="password" placeholder="Password admin" class="w-full border rounded-lg px-3 py-2">
    <button id="btnLogin" onclick="loginMigrasi()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg">LOGIN ADMIN</button>
  </div>

  <div id="infoLogin" class="hidden mt-3 text-sm bg-green-50 text-green-700 rounded-lg p-3">Login berhasil. Siap migrasi.</div>

  <button id="btnMigrasi" onclick="jalanMigrasi()" disabled class="w-full mt-4 bg-blue-600 text-white font-bold py-3 rounded-lg disabled:opacity-40">MULAI MIGRASI</button>

  <div class="mt-4">
    <p class="text-sm font-bold">Progress: <span id="progress">Belum mulai</span></p>
    <div class="w-full bg-gray-200 rounded-full h-3 mt-1 overflow-hidden"><div id="bar" class="bg-blue-600 h-3" style="width:0%"></div></div>
  </div>

  <div id="log" class="mt-4 bg-black text-green-300 text-xs rounded-lg p-3 h-64 overflow-y-auto whitespace-pre-wrap">Menunggu...</div>
  <a href="admin.html" class="block text-center text-sm text-blue-600 mt-4">← Kembali ke Admin</a>
</div>

<script>
let sudahLogin = false;
function tulisLog(teks){
  const l = document.getElementById('log');
  l.textContent += '\n' + teks;
  l.scrollTop = l.scrollHeight;
}
async function loginMigrasi(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!email || !password){ alert('Isi email & password dulu'); return; }
  try{
    await masuk(email, password);
    sudahLogin = true;
    document.getElementById('infoLogin').classList.remove('hidden');
    document.getElementById('btnMigrasi').disabled = false;
    tulisLog('Login berhasil.');
  }catch(e){ alert(e.message || 'Login gagal'); tulisLog('Login gagal: ' + (e.message || e)); }
}
function dataURLkeBlob(dataURL){
  const [head, data] = dataURL.split(',');
  const mime = (head.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(data);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
async function jalanMigrasi(){
  if(!sudahLogin){ alert('Login dulu'); return; }
  const btn = document.getElementById('btnMigrasi');
  btn.disabled = true; btn.textContent = 'SEDANG MIGRASI... JANGAN TUTUP HP';
  try{
    tulisLog('Mengambil data produk...');
    const produk = await semua('barang_public','id');
    const modalList = await semua('barang_private','id');
    const modalMap = Object.fromEntries(modalList.map(r => [r.id, r]));
    const list = produk.filter(b => typeof b.foto === 'string' && b.foto.startsWith('data:image'));
    tulisLog('Total masih Base64: ' + list.length + ' dari ' + produk.length);
    if(!list.length){ tulisLog('Sudah bersih, tidak ada yang perlu dimigrasi.'); btn.textContent = 'SUDAH BERSIH'; return; }
    let sukses = 0, gagal = 0;
    for(let i=0;i<list.length;i++){
      const b = list[i];
      try{
        tulisLog('[' + (i+1) + '/' + list.length + '] ' + b.nama + '...');
        const blob = dataURLkeBlob(b.foto);
        const urlBaru = await uploadFoto(blob, 'produk-' + b.id + '-' + Date.now() + '.jpg');
        const modalLama = modalMap[b.id] ? (modalMap[b.id].modal ?? 0) : 0;
        await hasil(db.rpc('simpan_produk', {
          p_id: b.id, p_baru: false, p_nama: b.nama,
          p_jual: b.jual ?? b.harga ?? 0, p_modal: modalLama,
          p_stok: b.stok ?? '0', p_keterangan: b.keterangan ?? '',
          p_foto: urlBaru, p_tanggal: b.tanggal_update || new Date().toISOString().slice(0,10)
        }));
        sukses++;
        tulisLog('  OK -> LINK');
      }catch(e){ gagal++; tulisLog('  GAGAL: ' + b.nama + ' - ' + (e.message || e)); }
      const persen = Math.round(((i+1)/list.length)*100);
      document.getElementById('bar').style.width = persen + '%';
      document.getElementById('progress').textContent = (i+1) + '/' + list.length + ' (' + persen + '%)';
      await new Promise(r => setTimeout(r, 200));
    }
    tulisLog('MIGRASI SELESAI. Sukses: ' + sukses + ', Gagal: ' + gagal);
    btn.textContent = 'MIGRASI SELESAI';
  }catch(e){
    tulisLog('ERROR BESAR: ' + (e.message || e));
    btn.disabled = false; btn.textContent = 'COBA LAGI';
  }
}
</script>
</body>
</html>

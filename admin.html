<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - UD. BILAL</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans">
<div class="max-w-md mx-auto pb-24">
  <!-- HEADER -->
  <div class="bg-green-600 text-white p-4 sticky top-0 z-10 rounded-b-2xl">
    <div class="flex justify-between items-center">
      <div><h1 class="font-extrabold text-lg leading-none">UD. BILAL</h1><p class="text-xs opacity-80 mt-1">Panel Admin Toko</p></div>
      <a href="index.html" class="bg-white text-green-700 text-xs font-bold px-3 py-2 rounded-full">Lihat Toko →</a>
    </div>
    <!-- STATISTIK -->
    <div class="grid grid-cols-3 gap-2 mt-3 text-center text-xs">
      <div class="bg-white/20 rounded-xl p-2"><p class="text-[11px] opacity-80">Total Barang</p><p id="totalBarang" class="font-extrabold text-lg leading-none mt-1">0</p></div>
      <div class="bg-white/20 rounded-xl p-2"><p class="text-[11px] opacity-80">Stok Menipis</p><p id="stokMenipis" class="font-extrabold text-lg leading-none mt-1">0</p></div>
      <div class="bg-white/20 rounded-xl p-2"><p class="text-[11px] opacity-80">Total Stok</p><p id="totalStok" class="font-extrabold text-lg leading-none mt-1">0</p></div>
    </div>
  </div>

  <!-- FORM -->
  <div class="p-3">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 id="formTitle" class="font-bold mb-3">Tambah Barang Baru</h2>
      <input type="hidden" id="editId">
      <div class="space-y-2">
        <input id="nama" placeholder="Nama Barang - cth: Beras Cap Ayam 5kg" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm">
        <div class="grid grid-cols-2 gap-2">
          <input id="harga" type="number" placeholder="Harga - cth: 65000" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm">
          <input id="stok" placeholder="Stok - cth: 5 Karung" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm">
        </div>
        <input id="kategori" placeholder="Kategori - cth: Beras" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm">
        <input id="gambar" placeholder="Link Gambar (boleh kosong)" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm">
        <textarea id="deskripsi" rows="2" placeholder="Deskripsi singkat (boleh kosong)" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm"></textarea>
        <button onclick="simpanBarang()" class="bg-green-600 text-white font-extrabold p-3 rounded-xl w-full">💾 Simpan Barang</button>
        <button id="btnBatal" onclick="batalEdit()" class="w-full text-sm text-gray-500 py-1 hidden">Batal Edit</button>
      </div>
    </div>

    <input id="cariAdmin" oninput="renderAdmin()" placeholder="🔍 Cari barang..." class="w-full p-2.5 border border-slate-300 rounded-xl bg-white text-sm mt-3">

    <h3 class="font-bold mt-4 mb-2 px-1">Daftar Barang</h3>
    <div id="listBarangAdmin" class="space-y-2"></div>
    <p class="text-center text-xs text-gray-400 mt-6">© UD. BILAL - Admin v123</p>
  </div>
</div>
<script type="module" src="script.js?v=123"></script>
</body>
</html>

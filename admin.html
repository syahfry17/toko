<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - UD. BILAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9}
  input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:14px}
  .btn-edit,.btn-hapus{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;font-size:14px;font-weight:700;border-radius:10px;border:none;cursor:pointer}
  .btn-edit{background:#facc15;color:#000}
  .btn-hapus{background:#ef4444;color:#fff}
  .btn-edit .ico,.btn-hapus .ico{font-size:15px;line-height:1}
</style>
</head>
<body>
<div class="max-w-md mx-auto pb-24">
  <div class="bg-green-600 text-white p-4 m-3 rounded-2xl shadow">
    <div class="flex justify-between items-start">
      <div>
        <h1 class="font-extrabold text-2xl leading-none">UD. BILAL <span class="text-[11px] font-bold bg-white/20 px-2 py-1 rounded-full align-middle">ADMIN</span></h1>
        <p class="text-xs text-green-200 mt-2">Halo Admin UD. BILAL</p>
      </div>
      <div class="flex gap-2 shrink-0">
        <a href="index.html" class="bg-white text-green-700 text-xs font-bold px-3 py-2 rounded-lg flex items-center gap-1">👀 Toko</a>
        <button onclick="logout()" class="bg-red-500 text-white text-xs font-bold px-3 py-2 rounded-lg">LOGOUT</button>
      </div>
    </div>
  </div>
  <div class="grid grid-cols-3 gap-2 px-3">
    <div class="bg-white rounded-xl p-3 text-center shadow-sm"><p id="totalProduk" class="font-extrabold text-lg leading-none">0</p><p class="text-[11px] text-gray-500 mt-1">TOTAL PRODUK</p></div>
    <div class="bg-white rounded-xl p-3 text-center shadow-sm"><p id="totalUntung" class="font-extrabold text-lg leading-none text-green-600">Rp 0</p><p class="text-[11px] text-gray-500 mt-1">TOTAL UNTUNG</p></div>
    <div class="bg-white rounded-xl p-3 text-center shadow-sm"><p id="stokMenipis" class="font-extrabold text-lg leading-none text-red-500">0</p><p class="text-[11px] text-gray-500 mt-1">STOK MENIPIS</p></div>
  </div>
  <div class="px-3 mt-3"><button onclick="bukaFormTambah()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow">+ Tambah Barang</button></div>
  <div id="formBarang" class="hidden px-3 mt-3">
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 id="formTitle" class="font-bold mb-3">Tambah Barang Baru</h2>
      <input type="hidden" id="editId">
      <div class="space-y-2">
        <input id="nama" placeholder="Nama Barang">
        <div class="grid grid-cols-2 gap-2">
          <input id="harga" type="number" placeholder="Harga Jual">
          <input id="modal" type="number" placeholder="Modal">
        </div>
        <input id="stok" placeholder="Stok - cth: 5 Karung">
        <input id="kategori" placeholder="Kategori">
        <input id="gambar" placeholder="Link Gambar (boleh kosong)">
        <textarea id="deskripsi" rows="2" placeholder="Deskripsi - cth: Tulis apa saja"></textarea>
        <button onclick="simpanBarang()" class="w-full bg-green-600 text-white font-extrabold p-3 rounded-xl">💾 Simpan Barang</button>
        <button onclick="tutupForm()" class="w-full text-sm text-gray-500 py-1">Batal</button>
      </div>
    </div>
  </div>
  <div class="px-3 mt-3"><input id="cariAdmin" oninput="renderAdmin()" placeholder="🔍 Cari barang..." class="border-green-600 border-2"></div>
  <div id="listBarangAdmin" class="grid grid-cols-2 gap-3 p-3"></div>
  <p class="text-center text-xs text-gray-400 mt-2">© UD. BILAL - Admin</p>
</div>
<script type="module" src="script.js"></script>
</body>
</html>

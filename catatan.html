<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Hutang - UD. Bilal</title>
    <!-- Anda bisa menghubungkan file CSS Anda di sini jika ingin menyamakan desain -->
    <!-- <link rel="stylesheet" href="style.css"> -->
    
    <style>
        /* Desain dasar tabel agar rapi */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Catatan Hutang Pelanggan</h1>
    
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Penghutang</th>
                <th>Produk yang Dihutang</th>
                <th>Jumlah (Rp)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Silakan ganti teks di dalam kurung siku dengan data asli -->
            <tr>
                <td>1</td>
                <td>[Nama Pelanggan]</td>
                <td>[Nama Produk]</td>
                <td>Rp 20.000</td>
            </tr>
            <!-- Anda bisa menambahkan baris (tr) baru di bawah ini untuk pelanggan lain -->
        </tbody>
    </table>

</body>
</html>

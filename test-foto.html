<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  body { font-family: sans-serif; background: #f0f0f0; padding: 15px; margin:0; }
  .kartu { background: white; border-radius: 12px; overflow: hidden; max-width: 350px; margin: auto; }
  .kotak-foto { width:100%; height:200px; background:#ddd; position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; }
  .kotak-foto img { width:100%; height:100%; object-fit:cover; display:none; position:absolute; inset:0; }
  .kotak-foto .tengah { text-align:center; color:#666; z-index:1; }
  .kotak-foto .tengah .icon { font-size:40px; }
  .kotak-foto .tengah .teks { font-size:14px; margin-top:5px; }
  .kotak-foto .ganti { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.6); color:white; font-size:11px; padding:5px 10px; border-radius:20px; display:none; z-index:2; }
  .kotak-foto.ada-foto .ganti { display:block; }
  .kotak-foto.ada-foto .tengah { display:none; }
  .isi { padding: 12px; }
  .nama { font-weight: bold; font-size: 18px; }
  .stok { background: green; color: white; padding: 4px 10px; border-radius: 20px; float: right; }
  #pilihFoto { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }

  #cropModal { display:none; position:fixed; inset:0; background:#000; z-index:999; flex-direction:column; }
  #cropArea { flex:1; position:relative; overflow:hidden; touch-action:none; background:#000; }
  #cropImg { position:absolute; left:0; top:0; width:100%; height:auto; will-change:transform; }
  #cropBox { position:absolute; left:5%; right:5%; top:50%; height:210px; transform:translateY(-50%); border:2px solid white; z-index:2; pointer-events:none; }
  #cropFooter { display:flex; justify-content:space-between; padding:15px 20px; background:#111; }
  #cropFooter button { background:none; border:none; color:#4CAF50; font-size:16px; font-weight:bold; padding:10px; }
  #zoomBar { padding:12px 15px; background:#111; color:white; display:flex; align-items:center; gap:10px; }
  #zoomBar button { width:40px; height:40px; border-radius:50%; border:none; background:white; font-size:22px; font-weight:bold; }
  #zoomBar input { flex:1; height:8px; }
  #zoomInfo { text-align:center; color:#FFC107; font-size:12px; padding:0 0 8px 0; background:#111; }
</style>
</head>
<body>

<h3 style="text-align:center">TES FOTO - Adam Sari</h3>
<p style="text-align:center; font-size:13px;">Pencet kotak fotonya di tengah:</p>

<input type="file" id="pilihFoto" accept="image/*">

<div class="kartu">
  <label class="kotak-foto" id="kotakFoto" for="pilihFoto">
    <img id="fotoTampil">
    <div class="tengah">
      <div class="icon">🖼️</div>
      <div class="teks">Belum Ada Foto<br><b>Klik Untuk Pilih Dari Galeri</b></div>
    </div>
    <div class="ganti">🖼️ Ganti Foto</div>
  </label>
  <div class="isi">
    <div class="nama">Adam Sari - Jeruk <span class="stok">STOK 12</span></div>
    <div>Modal: Rp 5.000 | Jual: Rp 6.000<br><b style="color:green">Untung: Rp 1.000</b></div>
  </div>
</div>

<div id="cropModal">
  <div id="cropArea">
    <img id="cropImg">
    <div id="cropBox"></div>
  </div>
  <div id="zoomInfo">👆 1 jari = geser &nbsp; | &nbsp; 🤏 2 jari dicubit = zoom</div>
  <div id="zoomBar">
    <button id="btnMinus">-</button>
    <input type="range" id="zoom" min="100" max="300" value="100">
    <button id="btnPlus">+</button>
  </div>
  <div id="cropFooter">
    <button id="btnBatal">Batal</button>
    <button id="btnSelesai">Selesai</button>
  </div>
</div>

<script>
  const fotoTampil = document.getElementById("fotoTampil");
  const kotakFoto = document.getElementById("kotakFoto");
  const pilihFoto = document.getElementById("pilihFoto");
  const modal = document.getElementById("cropModal");
  const cropImg = document.getElementById("cropImg");
  const cropArea = document.getElementById("cropArea");
  const cropBox = document.getElementById("cropBox");
  const zoomInput = document.getElementById("zoom");
  let imgX=0, imgY=0, startX=0, startY=0, sX=0, sY=0, lagiSeret=false, scale=1;
  let baseW=0, baseH=0;
  // BUAT CUBIT
  let lagiCubit=false, jarakAwal=0, scaleAwal=1;

  function jarakCubit(t1, t2){
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function kunciPosisi(){
    const box = cropBox.getBoundingClientRect();
    const area = cropArea.getBoundingClientRect();
    const w = baseW * scale, h = baseH * scale;
    let batasAtas = (box.top - area.top) - h + box.height;
    let batasBawah = box.top - area.top;
    if(imgY < batasAtas) imgY = batasAtas;
    if(imgY > batasBawah) imgY = batasBawah;
    if(imgX < -(w - (box.right - box.left)) - 20) imgX = -(w - (box.right - box.left)) - 20;
    if(imgX > 20) imgX = 20;
  }
  function updateImg(){ kunciPosisi(); cropImg.style.transform = `translate(${imgX}px, ${imgY}px) scale(${scale})`; cropImg.style.transformOrigin = "0 0"; }
  function setZoom(v){ v = Math.max(100, Math.min(300, v)); scale = v/100; zoomInput.value = v; updateImg(); }

  pilihFoto.addEventListener("change", function(e){
    const file = e.target.files[0]; if(!file) return;
    const url = URL.createObjectURL(file);
    cropImg.onload = function(){
      modal.style.display = "flex";
      setTimeout(function(){
        const areaW = cropArea.clientWidth;
        baseW = areaW;
        baseH = areaW * (cropImg.naturalHeight / cropImg.naturalWidth);
        cropImg.style.width = baseW + "px";
        cropImg.style.height = baseH + "px";
        const boxH = cropBox.clientHeight;
        if(baseH < boxH){ const r = boxH / baseH; baseW *= r; baseH *= r; cropImg.style.width = baseW + "px"; cropImg.style.height = baseH + "px"; }
        setZoom(100);
        const boxTop = cropBox.getBoundingClientRect().top - cropArea.getBoundingClientRect().top;
        imgX = (areaW - baseW) / 2;
        imgY = boxTop + (boxH - baseH) / 2;
        updateImg();
      }, 50);
    };
    cropImg.src = url;
  });

  // === INI KUNCI CUBITNYA BANG ===
  cropArea.addEventListener("touchstart", function(e){
    if(e.touches.length === 2){
      // MULAI CUBIT
      lagiCubit = true; lagiSeret = false;
      jarakAwal = jarakCubit(e.touches[0], e.touches[1]);
      scaleAwal = scale;
    } else if(e.touches.length === 1){
      // GESER 1 JARI
      lagiSeret = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      sX = imgX; sY = imgY;
    }
  }, {passive:true});

  cropArea.addEventListener("touchmove", function(e){
    e.preventDefault();
    if(lagiCubit && e.touches.length === 2){
      // LAGI DICUBIT - ZOOM
      const jarakBaru = jarakCubit(e.touches[0], e.touches[1]);
      const zoomBaru = (scaleAwal * (jarakBaru / jarakAwal)) * 100;
      setZoom(zoomBaru);
    } else if(lagiSeret && e.touches.length === 1){
      // LAGI DIGESER
      imgX = sX + (e.touches[0].clientX - startX);
      imgY = sY + (e.touches[0].clientY - startY);
      updateImg();
    }
  }, {passive:false});

  cropArea.addEventListener("touchend", function(e){
    if(e.touches.length < 2) lagiCubit = false;
    if(e.touches.length === 0) lagiSeret = false;
    // Kalo abis cubit, terus masih 1 jari nempel, jadiin geser lagi
    if(e.touches.length === 1){
      lagiSeret = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      sX = imgX; sY = imgY;
    }
  });
  // Buat di laptop
  cropArea.addEventListener("mousedown", function(e){ lagiSeret=true; startX=e.clientX; startY=e.clientY; sX=imgX; sY=imgY; });
  window.addEventListener("mousemove", function(e){ if(!lagiSeret) return; imgX=sX+(e.clientX-startX); imgY=sY+(e.clientY-startY); updateImg(); });
  window.addEventListener("mouseup", function(){ lagiSeret=false; });

  zoomInput.addEventListener("input", function(){ setZoom(Number(this.value)); });
  document.getElementById("btnPlus").onclick = function(){ setZoom(Number(zoomInput.value)+25); };
  document.getElementById("btnMinus").onclick = function(){ setZoom(Number(zoomInput.value)-25); };
  document.getElementById("btnBatal").onclick = function(){ modal.style.display="none"; pilihFoto.value=""; };
  document.getElementById("btnSelesai").onclick = function(){
    const canvas = document.createElement("canvas");
    const box = cropBox.getBoundingClientRect();
    const imgRect = cropImg.getBoundingClientRect();
    const sx = Math.max(0, (box.left - imgRect.left) * (cropImg.naturalWidth / imgRect.width));
    const sy = Math.max(0, (box.top - imgRect.top) * (cropImg.naturalHeight / imgRect.height));
    const sw = box.width * (cropImg.naturalWidth / imgRect.width);
    const sh = box.height * (cropImg.naturalHeight / imgRect.height);
    canvas.width = 700; canvas.height = 400;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(cropImg, sx, sy, sw, sh, 0, 0, 700, 400);
    fotoTampil.src = canvas.toDataURL("image/jpeg", 0.9);
    fotoTampil.style.display = "block";
    kotakFoto.classList.add("ada-foto");
    modal.style.display = "none";
  };
</script>
</body>
</html>

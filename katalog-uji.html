  <style>
    #tabel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .kartu { background: #fff; border: 1px solid #eee; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
    .kartu img.foto-produk { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #f8f8f8; }
    .badge-baru { font-size: 10px; background: #ff3b30; color: #fff; padding: 2px 6px; border-radius: 20px; font-weight: 700; }
    .last-update { font-size: 10px; color: #999; }
    /* --- HEADER HIJAU v122 - LOGO ORIGINAL --- */
    .header-toko { display:flex; align-items:center; gap:12px; margin-bottom:12px; background:linear-gradient(135deg,#166534 0%,#16a34a 100%); padding:14px; border-radius:18px; box-shadow:0 4px 14px rgba(22,163,74,.35); }
    .header-toko h1 { color:#fff; font-size:24px; font-weight:900; line-height:1; }
    .header-toko h1 span { color:#fbbf24; }
    .header-toko p { color:#fef3c7; font-size:13px; font-weight:600; margin-top:4px; }
    .header-toko .garis { width:118px; height:3px; background:linear-gradient(90deg,#fff,#fbbf24); border-radius:99px; margin-top:6px; }
    .search-toko { width:100%; border:2px solid #e5e7eb; padding:12px 14px; border-radius:14px; background:#fff; font-weight:600; font-size:14px; outline:none; margin-bottom:12px; }
    .search-toko:focus { border-color:#16a34a; }

  <input id="inputCari" oninput="cariBarang(this.value)" type="text" placeholder="🔍 Cari barang... misal: Beras, Minyak, Gula" class="search-toko" autocomplete="off" data-lpignore="true">

  <script>
const NOMOR_WA = '6281919194295';
const perPage = 12;
let barang = [], kataCari = '', currentPage = 1;
function el(id) { return document.getElementById(id); }
function isHariIni(date) { return date === new Date().toLocaleDateString('sv-SE'); }
function fotoAman(value){
  const v = String(value || '').trim();
  return /^(https?:\/\/|data:image\/(?:png|jpe?g|webp|gif);base64,)/i.test(v) || /^(?:\.\.?\/)?[\w/-]+\.(?:png|jpe?g|webp|gif)$/i.test(v) ? v : '';
}
function aksi(nama, id){ return aman(nama + '(' + JSON.stringify(String(id)) + ')'); }

function bersihKet(teks) { if (!teks) return ''; return teks.toString().replace(/^\s*\/\s*/, '').trim(); }
function aman(teks) { return String(teks ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let cariTimer = null;
window.cariBarang = (teks) => { clearTimeout(cariTimer); cariTimer = setTimeout(()=>{ kataCari = teks.toLowerCase().trim(); currentPage = 1; render(); }, 250); };

window.bukaZoomFoto = (id) => {
  const b = barang.find(x => x.id === id); if(!b || !b.foto) return;
  let modal = document.getElementById('modalZoomFoto'); if(modal) modal.remove();
  modal = document.createElement('div'); modal.id = 'modalZoomFoto'; modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;display:flex;align-items:center;justify-content:center;';
  modal.innerHTML = `<img src="${aman(fotoAman(b.foto))}" style="max-width:95%;max-height:90%;"><button onclick="document.getElementById('modalZoomFoto').remove()" style="position:absolute;top:15px;right:15px;background:white;width:36px;height:36px;border-radius:50%;font-weight:bold;">✕</button>`;
  modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.remove(); }); document.body.appendChild(modal);
};

window.beliSekarang = (id) => {
  const b = barang.find(x => x.id === id); if(!b) return; let q = 1; let j = b.jual ?? b.harga ?? 0; let total = q * j;
  let pesan = `Halo UD. BILAL, saya mau pesan:\n- ${b.nama}\n- Jumlah: ${q}\n- Harga: Rp ${Number(j).toLocaleString('id-ID')} / pcs\n- Total: Rp ${Number(total).toLocaleString('id-ID')}`;
  window.open(`https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(pesan)}`, '_blank');
};

function render() {
  let hasilCari = barang.filter(b => String(b.nama ?? '').toLowerCase().includes(kataCari) || String(b.keterangan ?? '').toLowerCase().includes(kataCari));
  let totalPage = Math.max(1, Math.ceil(hasilCari.length / perPage)); if (currentPage > totalPage) currentPage = totalPage;
  let list = hasilCari.slice((currentPage - 1) * perPage, currentPage * perPage); let html = '';
  list.forEach(b => {
    let j = b.jual ?? b.harga ?? 0; let ket = bersihKet(b.keterangan);
    let badgeBaru = isHariIni(b.tanggal_update) ? `<span class="badge-baru">BARU</span>` : '';
    let foto = b.foto ? `<img loading="lazy" decoding="async" src="${aman(fotoAman(b.foto))}" onclick="${aksi('bukaZoomFoto', b.id)}" class="foto-produk cursor-pointer" alt="${aman(b.nama)}">` : `<div class="w-full flex items-center justify-center text-gray-400 text-xs" style="aspect-ratio:1/1;background:#f8f8f8;">Belum ada foto</div>`;
    let tombolWA = `<button onclick="${aksi('beliSekarang', b.id)}" class="w-full mt-2 py-2.5 rounded-lg font-bold text-white text-[13px]" style="background:#25D366;box-shadow:0 3px 10px rgba(37,211,102,.4);">💬 Pesan via WA</button>`;
    let isiKartu = `<div class="p-2 text-center flex-1 flex flex-col"><p class="font-bold text-[15px] leading-tight line-clamp-2 min-h-[38px]">${aman(b.nama)}</p><p class="text-gray-400 font-bold text-[14px] mt-1">Rp${Number(j).toLocaleString('id-ID')}</p><p class="text-[12px] text-gray-500 mt-1 min-h-[18px]">${ket ? aman(ket) : '-'}</p>${tombolWA}</div>`;
    html += `<div class="kartu"><div class="relative">${foto}<div class="absolute top-1 left-1">${badgeBaru}</div></div>${isiKartu}</div>`;
  });
  if (barang.length && hasilCari.length === 0) html = `<p class="text-center text-gray-400 py-4 col-span-2">Barang gak ketemu, coba kata lain</p>`;
  const tabel = el('tabel'); if(tabel) tabel.innerHTML = html;
  const info = el('infoPage'); if(info) info.innerText = `Page ${currentPage} / ${totalPage} (Total ${hasilCari.length} barang)`;
  document.querySelector('.footer').textContent = 'Total Jenis Produk: ' + barang.length;
}
window.gantiPage = (n) => { let tp = Math.max(1, Math.ceil(barang.length / perPage)); currentPage += n; if (currentPage < 1) currentPage = 1; if (currentPage > tp) currentPage = tp; render(); window.scrollTo(0, 0); };


const url = 'https://dtnnmyhqajjonrdroilp.supabase.co';
const key = 'sb_publishable_oXJDmTUAiNoNpVh8R31ZUQ_FykFUQUS';

async function muatKatalog() {
  const status = el('status');
  el('retry').hidden = true;
  status.textContent = 'Menghubungkan ke Supabase…';
  const rows = [];
  try {
    for (;;) {
      const params = new URLSearchParams({
        select: 'id,nama,jual,stok,keterangan,foto,tanggal_update',
        order: 'nama.asc,id.asc', limit: '50', offset: String(rows.length)
      });
      const response = await fetch(url + '/rest/v1/barang_public?' + params, {
        headers: { apikey: key }, cache: 'no-store'
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const page = await response.json();
      if (!Array.isArray(page)) throw new Error('Respons tidak sesuai');
      rows.push(...page);
      if (!page.length) break;
    }
    barang = rows;
    render();
    status.textContent = 'Terhubung ke Supabase. ' + rows.length + ' produk.';
  } catch (error) {
    status.textContent = 'Katalog gagal dimuat (' + error.message + ').';
    el('retry').hidden = false;
  }
}
el('retry').addEventListener('click', muatKatalog);
muatKatalog();
</script>
